name: Blog framework checks
on:
  push:
    paths: ['Blog_Framework/**', '.github/workflows/blog-framework-ci.yml']
  pull_request:
    paths: ['Blog_Framework/**', '.github/workflows/blog-framework-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Blog_Framework
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: npm run verify
