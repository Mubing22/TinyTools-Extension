name: Idictation words checks
on:
  push:
    paths: ['idictation-words/**', '.github/workflows/idictation-words-ci.yml']
  pull_request:
    paths: ['idictation-words/**', '.github/workflows/idictation-words-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: idictation-words
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: npm run verify
      - name: Check Bash launcher syntax
        if: runner.os != 'Windows'
        run: bash -n start.sh
      - name: Check PowerShell launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'ensure-node.ps1'), [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
