<canvas id="bg-canvas" aria-hidden="true"></canvas>
    <header class="site-banner">
        <div id="bg-image"></div>
        <div class="banner-content"></div>
    </header>
    <main class="article-layout">
        <article class="article-shell" id="article-shell">
            <div class="article-meta"><span id="article-date" aria-hidden="true"></span><span class="status" id="article-status"></span><span class="article-stats" id="article-stats" aria-label="文章统计"><span id="article-word-count">字数 --</span><span class="stats-divider" aria-hidden="true">·</span><span id="article-reading-time">阅读约 -- 分钟</span></span></div>
            <h2 id="article-title">Loading...</h2>
            <div class="article-content" id="article-content"></div>
            <div class="end-marker">[ END OF RECORD ]</div>
        </article>
        <aside class="article-toc" id="article-toc" aria-label="文章目录" hidden>
            <div class="toc-header">
                <span class="toc-label">CONTENTS</span>
                <button class="toc-collapse" id="toc-collapse" type="button" aria-label="折叠文章目录" aria-expanded="true">−</button>
            </div>
            <div class="toc-body" id="toc-body" role="navigation" aria-label="文章目录列表"></div>
        </aside>
    </main>
